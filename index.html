<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Currency Flow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💱</text></svg>">
</head>
<body>
    <div class="container">
        <!-- Баланс пользователя -->
        <div class="balance">
            <div class="balance-title">ВАШ БАЛАНС</div>
            <div class="balance-amount" id="totalBalance">100 000 ₽</div>
        </div>

        <!-- Список валют -->
        <div class="currencies" id="currenciesList">
            <!-- Валюты будут добавляться через JS -->
        </div>

        <!-- Панель обмена -->
        <div class="exchange-panel">
            <div class="selected-currency" id="selectedCurrencyInfo">
                <div class="selected-icon">💱</div>
                <div class="selected-name">Выберите валюту</div>
            </div>

            <div class="price-info">
                <div class="current-price" id="currentPrice">0 ₽</div>
                <div class="price-change" id="priceChange">0%</div>
            </div>

            <div class="controls">
                <div class="amount-control">
                    <div class="amount-label">СУММА</div>
                    <div class="amount-inputs">
                        <button class="amount-btn minus">−</button>
                        <input type="number" id="tradeAmount" value="1000" min="100" max="100000">
                        <button class="amount-btn plus">+</button>
                    </div>
                    <div class="quick-buttons">
                        <button class="quick-btn" data-percent="25">25%</button>
                        <button class="quick-btn" data-percent="50">50%</button>
                        <button class="quick-btn" data-percent="100">100%</button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn buy" id="buyBtn">КУПИТЬ</button>
                    <button class="action-btn sell" id="sellBtn">ПРОДАТЬ</button>
                </div>
            </div>

            <div class="portfolio">
                <div class="portfolio-title">ВАШИ АКТИВЫ</div>
                <div class="portfolio-amount" id="portfolioAmount">0</div>
            </div>
        </div>
    </div>

    <!-- Уведомления -->
    <div class="notification" id="notification"></div>

    <script src="script.js"></script>
</body>
</html>
