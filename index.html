<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Валютный Трейдер</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Фоновое видео -->
    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>

    <!-- Уведомление -->
    <div id="notification" class="notification hidden">
        <div class="notification-content">
            <span id="notificationText">Новость появилась</span>
        </div>
    </div>

    <div class="container">
        <!-- Верхняя панель -->
        <header class="header">
            <button class="header-btn" id="ratingBtn">
                <i class="fas fa-trophy"></i>
                <span>Рейтинг</span>
            </button>
            
            <button class="header-btn" id="portfolioBtn">
                <i class="fas fa-wallet"></i>
                <span>Мой портфель</span>
            </button>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Доллар -->
            <div class="currency-card">
                <div class="currency-header">
                    <i class="fas fa-dollar-sign currency-icon"></i>
                    <h2 class="currency-title">Доллар США</h2>
                </div>
                <div class="currency-price" id="usdPrice">80.50 ₽</div>
                <div class="currency-change" id="usdChange">+0.5%</div>
                
                <div class="trade-controls">
                    <div class="amount-buttons">
                        <button class="amount-btn" data-amount="100">100</button>
                        <button class="amount-btn" data-amount="500">500</button>
                        <button class="amount-btn" data-amount="1000">1000</button>
                    </div>
                    
                    <div class="trade-buttons">
                        <button class="trade-btn sell-btn" data-currency="USD" data-action="sell">
                            <i class="fas fa-arrow-down"></i> Продать
                        </button>
                        <button class="trade-btn buy-btn" data-currency="USD" data-action="buy">
                            <i class="fas fa-arrow-up"></i> Купить
                        </button>
                    </div>
                </div>
            </div>

            <!-- Евро -->
            <div class="currency-card">
                <div class="currency-header">
                    <i class="fas fa-euro-sign currency-icon"></i>
                    <h2 class="currency-title">Евро</h2>
                </div>
                <div class="currency-price" id="eurPrice">90.25 ₽</div>
                <div class="currency-change" id="eurChange">-0.3%</div>
                
                <div class="trade-controls">
                    <div class="amount-buttons">
                        <button class="amount-btn" data-amount="100">100</button>
                        <button class="amount-btn" data-amount="500">500</button>
                        <button class="amount-btn" data-amount="1000">1000</button>
                    </div>
                    
                    <div class="trade-buttons">
                        <button class="trade-btn sell-btn" data-currency="EUR" data-action="sell">
                            <i class="fas fa-arrow-down"></i> Продать
                        </button>
                        <button class="trade-btn buy-btn" data-currency="EUR" data-action="buy">
                            <i class="fas fa-arrow-up"></i> Купить
                        </button>
                    </div>
                </div>
            </div>

            <!-- Юань -->
            <div class="currency-card">
                <div class="currency-header">
                    <i class="fas fa-yen-sign currency-icon"></i>
                    <h2 class="currency-title">Китайский юань</h2>
                </div>
                <div class="currency-price" id="cnyPrice">11.80 ₽</div>
                <div class="currency-change" id="cnyChange">+1.2%</div>
                
                <div class="trade-controls">
                    <div class="amount-buttons">
                        <button class="amount-btn" data-amount="100">100</button>
                        <button class="amount-btn" data-amount="500">500</button>
                        <button class="amount-btn" data-amount="1000">1000</button>
                    </div>
                    
                    <div class="trade-buttons">
                        <button class="trade-btn sell-btn" data-currency="CNY" data-action="sell">
                            <i class="fas fa-arrow-down"></i> Продать
                        </button>
                        <button class="trade-btn buy-btn" data-currency="CNY" data-action="buy">
                            <i class="fas fa-arrow-up"></i> Купить
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Баланс -->
        <footer class="footer">
            <div class="balance-display">
                <i class="fas fa-wallet"></i>
                <span>Баланс: <strong id="balance">1500</strong> ₽</span>
            </div>
        </footer>
    </div>

    <!-- Модальные окна -->
    <div id="ratingModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-trophy"></i> Рейтинг игроков</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="rating-list" id="ratingList">
                    <!-- Рейтинг будет здесь -->
                </div>
            </div>
        </div>
    </div>

    <div id="portfolioModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-wallet"></i> Мой портфель</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="portfolio-items">
                    <div class="portfolio-item">
                        <span class="currency-name">USD</span>
                        <span class="currency-amount" id="portfolioUSD">0.00</span>
                        <span class="currency-value" id="portfolioUSDValue">0 ₽</span>
                    </div>
                    <div class="portfolio-item">
                        <span class="currency-name">EUR</span>
                        <span class="currency-amount" id="portfolioEUR">0.00</span>
                        <span class="currency-value" id="portfolioEURValue">0 ₽</span>
                    </div>
                    <div class="portfolio-item">
                        <span class="currency-name">CNY</span>
                        <span class="currency-amount" id="portfolioCNY">0.00</span>
                        <span class="currency-value" id="portfolioCNYValue">0 ₽</span>
                    </div>
                </div>
                <div class="portfolio-total">
                    Общая стоимость: <strong id="portfolioTotal">1500</strong> ₽
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
