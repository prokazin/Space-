<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Валютный Трейдер</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <!-- Фоновое видео -->
    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>

    <!-- Уведомление -->
    <div id="notification" class="notification">
        <div class="notification-content animate__animated animate__slideInDown">
            <i class="fas fa-bullhorn"></i>
            <span id="notificationText">Добро пожаловать!</span>
        </div>
    </div>

    <div class="container">
        <!-- Верхняя панель -->
        <div class="top-bar">
            <button class="icon-btn" id="ratingBtn">
                <i class="fas fa-trophy"></i>
            </button>
            
            <div class="balance-info">
                <div class="balance-amount">1500 ₽</div>
                <div class="balance-label">Баланс</div>
            </div>
            
            <button class="icon-btn" id="portfolioBtn">
                <i class="fas fa-wallet"></i>
            </button>
        </div>

        <!-- Основной контент - 3 валюты рядом -->
        <main class="currencies-grid">
            <!-- Доллар -->
            <div class="currency-card ios-style">
                <div class="currency-content">
                    <div class="currency-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="currency-name">USD/RUB</div>
                    <div class="currency-price animate__animated" id="usdPrice">80.50</div>
                    <div class="currency-change" id="usdChange">
                        <span class="change-value">+0.5%</span>
                        <i class="fas fa-arrow-up change-icon"></i>
                    </div>
                    
                    <div class="amount-selector">
                        <button class="amount-option" data-amount="100">100</button>
                        <button class="amount-option active" data-amount="500">500</button>
                        <button class="amount-option" data-amount="1000">1000</button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn sell" data-currency="USD" data-action="sell">
                            Продать
                        </button>
                        <button class="action-btn buy" data-currency="USD" data-action="buy">
                            Купить
                        </button>
                    </div>
                </div>
            </div>

            <!-- Евро -->
            <div class="currency-card ios-style">
                <div class="currency-content">
                    <div class="currency-icon">
                        <i class="fas fa-euro-sign"></i>
                    </div>
                    <div class="currency-name">EUR/RUB</div>
                    <div class="currency-price animate__animated" id="eurPrice">90.25</div>
                    <div class="currency-change" id="eurChange">
                        <span class="change-value">-0.3%</span>
                        <i class="fas fa-arrow-down change-icon"></i>
                    </div>
                    
                    <div class="amount-selector">
                        <button class="amount-option" data-amount="100">100</button>
                        <button class="amount-option active" data-amount="500">500</button>
                        <button class="amount-option" data-amount="1000">1000</button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn sell" data-currency="EUR" data-action="sell">
                            Продать
                        </button>
                        <button class="action-btn buy" data-currency="EUR" data-action="buy">
                            Купить
                        </button>
                    </div>
                </div>
            </div>

            <!-- Юань -->
            <div class="currency-card ios-style">
                <div class="currency-content">
                    <div class="currency-icon">
                        <i class="fas fa-yen-sign"></i>
                    </div>
                    <div class="currency-name">CNY/RUB</div>
                    <div class="currency-price animate__animated" id="cnyPrice">11.80</div>
                    <div class="currency-change" id="cnyChange">
                        <span class="change-value">+1.2%</span>
                        <i class="fas fa-arrow-up change-icon"></i>
                    </div>
                    
                    <div class="amount-selector">
                        <button class="amount-option" data-amount="100">100</button>
                        <button class="amount-option active" data-amount="500">500</button>
                        <button class="amount-option" data-amount="1000">1000</button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn sell" data-currency="CNY" data-action="sell">
                            Продать
                        </button>
                        <button class="action-btn buy" data-currency="CNY" data-action="buy">
                            Купить
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Подсказка -->
        <div class="hint">
            <i class="fas fa-info-circle"></i>
            <span>Курсы обновляются каждые 3 секунды</span>
        </div>
    </div>

    <!-- Модальное окно рейтинга -->
    <div id="ratingModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-container ios-modal">
            <div class="modal-header">
                <h2><i class="fas fa-trophy"></i> Рейтинг</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="rating-list compact">
                    <!-- Рейтинг будет здесь -->
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно портфеля -->
    <div id="portfolioModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-container ios-modal">
            <div class="modal-header">
                <h2><i class="fas fa-wallet"></i> Портфель</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="portfolio-summary">
                    <div class="portfolio-item">
                        <div class="item-icon">
                            <i class="fas fa-dollar-sign"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-name">Доллар</div>
                            <div class="item-amount" id="portfolioUSD">0.00 USD</div>
                        </div>
                        <div class="item-value" id="portfolioUSDValue">0 ₽</div>
                    </div>
                    
                    <div class="portfolio-item">
                        <div class="item-icon">
                            <i class="fas fa-euro-sign"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-name">Евро</div>
                            <div class="item-amount" id="portfolioEUR">0.00 EUR</div>
                        </div>
                        <div class="item-value" id="portfolioEURValue">0 ₽</div>
                    </div>
                    
                    <div class="portfolio-item">
                        <div class="item-icon">
                            <i class="fas fa-yen-sign"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-name">Юань</div>
                            <div class="item-amount" id="portfolioCNY">0.00 CNY</div>
                        </div>
                        <div class="item-value" id="portfolioCNYValue">0 ₽</div>
                    </div>
                </div>
                
                <div class="portfolio-total">
                    <div class="total-label">Общая стоимость</div>
                    <div class="total-value" id="portfolioTotal">1500 ₽</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
